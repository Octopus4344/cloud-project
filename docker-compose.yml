version: '3.8'

x-aws-env: &aws-env
  NODE_ENV: development
  AWS_REGION: us-east-1
  AWS_ACCESS_KEY_ID: test
  AWS_SECRET_ACCESS_KEY: test
  AWS_ENDPOINT_URL: http://localstack:4566

x-sqs-urls: &sqs-urls
  SQS_ROAD_EVENT_QUEUE_URL: http://localstack:4566/000000000000/dev-road-event-queue
  SQS_USER_DATA_QUEUE_URL: http://localstack:4566/000000000000/dev-user-data-queue
  SQS_USER_LOCATION_QUEUE_URL: http://localstack:4566/000000000000/dev-user-location-queue
  SQS_STATISTICS_QUEUE_URL: http://localstack:4566/000000000000/dev-statistics-queue
  SQS_AUTHORITIES_QUEUE_URL: http://localstack:4566/000000000000/dev-authorities-queue
  SQS_ARCHIVE_QUEUE_URL: http://localstack:4566/000000000000/dev-archive-queue
  SNS_ROAD_EVENTS_COMPLETED_ARN: arn:aws:sns:us-east-1:000000000000:dev-road-events-completed

x-dynamo-tables: &dynamo-tables
  DYNAMODB_ROAD_EVENTS_TABLE: dev-road-events
  DYNAMODB_EVENT_STATUS_TABLE: dev-event-status
  DYNAMODB_USERS_TABLE: dev-users
  DYNAMODB_LOCATIONS_TABLE: dev-locations
  DYNAMODB_STATISTICS_TABLE: dev-statistics
  DYNAMODB_INCIDENTS_TABLE: dev-incidents

networks:
  microservices-network:
    driver: bridge

services:
  localstack:
    image: localstack/localstack:latest
    ports:
      - '4566:4566'
    environment:
      SERVICES: sqs,sns,dynamodb,s3,cognito-idp,lambda
      DEFAULT_REGION: us-east-1
      PERSISTENCE: 1
    volumes:
      - localstack-data:/var/lib/localstack
    networks: [microservices-network]
    healthcheck:
      test: ['CMD', 'curl', '-f', 'http://localhost:4566/_localstack/health']
      interval: 15s
      timeout: 10s
      retries: 5

  nginx:
    image: nginx:latest
    ports: ['80:80']
    volumes: ['./nginx.conf:/etc/nginx/conf.d/default.conf:ro']
    depends_on:
      - authorities-service
      - road-event-service
      - statistics-service
      - user-data-service
      - user-location-service
    networks: [microservices-network]

  authorities-service:
    build:
      context: .
      dockerfile: apps/authorities-service/Dockerfile
    image: authorities-service:latest
    environment:
      <<: [*aws-env, *sqs-urls, *dynamo-tables]
    expose: ['3006']
    networks: [microservices-network]
    depends_on:
      localstack:
        condition: service_healthy
    healthcheck:
      test: ['CMD', 'curl', '-f', 'http://localhost:3006/health']
      interval: 30s
      timeout: 10s
      retries: 3
    deploy:
      replicas: 2

  road-event-service:
    build:
      context: .
      dockerfile: apps/road-event-service/Dockerfile
    image: road-event-service:latest
    environment:
      <<: [*aws-env, *sqs-urls, *dynamo-tables]
    expose: ['3000']
    networks: [microservices-network]
    depends_on:
      localstack:
        condition: service_healthy
    healthcheck:
      test: ['CMD', 'curl', '-f', 'http://localhost:3000/health']
      interval: 30s
      timeout: 10s
      retries: 3
    deploy:
      replicas: 3

  statistics-service:
    build:
      context: .
      dockerfile: apps/satistics-service/Dockerfile
    image: statistics-service:latest
    environment:
      <<: [*aws-env, *sqs-urls, *dynamo-tables]
    expose: ['3005']
    networks: [microservices-network]
    depends_on:
      localstack:
        condition: service_healthy
    healthcheck:
      test: ['CMD', 'curl', '-f', 'http://localhost:3005/health']
      interval: 30s
      timeout: 10s
      retries: 3
    deploy:
      replicas: 4

  user-data-service:
    build:
      context: .
      dockerfile: apps/user-data-service/Dockerfile
    image: user-data-service:latest
    environment:
      <<: [*aws-env, *sqs-urls, *dynamo-tables]
      COGNITO_USER_POOL_ID: us-east-1_localstack
      COGNITO_APP_CLIENT_ID: localstack-client-id
    expose: ['3001']
    networks: [microservices-network]
    depends_on:
      localstack:
        condition: service_healthy
    healthcheck:
      test: ['CMD', 'curl', '-f', 'http://localhost:3001/health']
      interval: 30s
      timeout: 10s
      retries: 3
    deploy:
      replicas: 2

  user-location-service:
    build:
      context: .
      dockerfile: apps/user-location-service/Dockerfile
    image: user-location-service:latest
    environment:
      <<: [*aws-env, *sqs-urls, *dynamo-tables]
    expose: ['3004']
    networks: [microservices-network]
    depends_on:
      localstack:
        condition: service_healthy
    healthcheck:
      test: ['CMD', 'curl', '-f', 'http://localhost:3004/health']
      interval: 30s
      timeout: 10s
      retries: 3
    deploy:
      replicas: 3

volumes:
  localstack-data:
