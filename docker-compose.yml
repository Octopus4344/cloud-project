version: '3.8'

services:
  nginx:
    image: nginx:latest
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - authorities-service
      - road-event-service
      - statistics-service
      - user-data-service
      - user-location-service
    networks:
      - microservices-network

  authorities-service:
    build:
      context: .
      dockerfile: apps/authorities-service/Dockerfile
    image: authorities-service:latest
    deploy:
      replicas: 2
    environment:
      - NODE_ENV=development
      - DATABASE_URL=${DATABASE_URL}
      - RABBITMQ_URL=${RABBITMQ_URL}
    expose:
      # Zmieniono z ports na expose
      - "3006"
    networks:
      - microservices-network
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:3006/health" ]
      interval: 30s
      timeout: 10s
      retries: 3

  road-event-service:
    build:
      context: .
      dockerfile: apps/road-event-service/Dockerfile
    image: road-event-service:latest
    deploy:
      replicas: 3
    environment:
      - NODE_ENV=development
      - DATABASE_URL=${DATABASE_URL}
      - RABBITMQ_URL=${RABBITMQ_URL}
    expose:
      - "3000"
    networks:
      - microservices-network
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:3000/health" ]
      interval: 30s
      timeout: 10s
      retries: 3

  statistics-service:
    build:
      context: .
      dockerfile: apps/satistics-service/Dockerfile # Corrected to match actual directory name
    image: statistics-service:latest
    deploy:
      replicas: 4
    environment:
      - NODE_ENV=development
      - DATABASE_URL=${DATABASE_URL}
      - RABBITMQ_URL=${RABBITMQ_URL}
    expose:
      - "3005"
    networks:
      - microservices-network
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:3005/health" ]
      interval: 30s
      timeout: 10s
      retries: 3

  user-data-service:
    build:
      context: .
      dockerfile: apps/user-data-service/Dockerfile
    image: user-data-service:latest
    deploy:
      replicas: 2
    environment:
      - NODE_ENV=development
      - DATABASE_URL=${DATABASE_URL}
      - RABBITMQ_URL=${RABBITMQ_URL}
    expose:
      - "3001"
    networks:
      - microservices-network
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:3001/health" ]
      interval: 30s
      timeout: 10s
      retries: 3

  user-location-service:
    build:
      context: .
      dockerfile: apps/user-location-service/Dockerfile
    image: user-location-service:latest
    deploy:
      replicas: 3
    environment:
      - NODE_ENV=development
      - DATABASE_URL=${DATABASE_URL}
      - RABBITMQ_URL=${RABBITMQ_URL}
    expose:
      - "3004"
    networks:
      - microservices-network
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:3004/health" ]
      interval: 30s
      timeout: 10s
      retries: 3

networks:
  microservices-network:
    driver: bridge
